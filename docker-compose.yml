services:

    nginx:
        image: nginx:latest
        container_name: monitoring-nginx
        ports:
            - "8080:80"
        networks:
            - monitoring
    
    loki:
        image: grafana/loki:latest
        container_name: monitoring-loki
        ports:
            - "3100:3100"
        command: -config.file=/etc/loki/local-config.yaml
        networks:
            - monitoring
    grafana:
        image: grafana/grafana:latest
        container_name: monitoring-grafana
        ports:
            - "3000:3000"
        networks:
            - monitoring
        depends_on:
            - loki

networks:
    monitoring: